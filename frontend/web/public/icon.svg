<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a6a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#shelfGrad)"/>
  <!-- Shelf icon - three horizontal bars representing a shelf -->
  <g fill="#faf8f5">
    <!-- Top shelf -->
    <rect x="120" y="140" width="272" height="24" rx="6"/>
    <!-- Middle shelf -->
    <rect x="120" y="244" width="272" height="24" rx="6"/>
    <!-- Bottom shelf -->
    <rect x="120" y="348" width="272" height="24" rx="6"/>
    <!-- Left support -->
    <rect x="120" y="140" width="20" height="232" rx="4"/>
    <!-- Right support -->
    <rect x="372" y="140" width="20" height="232" rx="4"/>
    <!-- Items on shelves - small rectangles representing habits/books -->
    <rect x="160" y="180" width="40" height="64" rx="4" opacity="0.7"/>
    <rect x="210" y="200" width="30" height="44" rx="4" opacity="0.5"/>
    <rect x="260" y="185" width="35" height="59" rx="4" opacity="0.6"/>
    <rect x="310" y="195" width="45" height="49" rx="4" opacity="0.55"/>
    <rect x="165" y="290" width="50" height="58" rx="4" opacity="0.65"/>
    <rect x="235" y="300" width="38" height="48" rx="4" opacity="0.5"/>
    <rect x="295" y="285" width="55" height="63" rx="4" opacity="0.6"/>
  </g>
</svg>
