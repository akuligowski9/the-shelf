name: Reset Demo Data

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset demo database
        run: |
          curl -X POST \
            -H "X-Reset-Secret: ${{ secrets.DEMO_RESET_SECRET }}" \
            https://shelf-api-demo-785607788916.us-east1.run.app/demo/reset
        env:
          DEMO_RESET_SECRET: ${{ secrets.DEMO_RESET_SECRET }}
