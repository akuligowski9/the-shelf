name: Nightly Production Backup

on:
  schedule:
    # Run at 5am UTC (midnight EST) every day
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: backend/api

      - name: Run backup from production
        run: node backup.js
        working-directory: backend/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Commit and push backup
        run: |
          echo "=== WORKFLOW VERSION 2 ==="
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated backup $(date +%Y-%m-%d)"

          # Retry push up to 3 times with pull
          for i in 1 2 3; do
            echo "Push attempt $i..."
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push succeeded!"
              exit 0
            fi
            echo "Push failed, retrying..."
            sleep 2
          done
          echo "All push attempts failed"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
