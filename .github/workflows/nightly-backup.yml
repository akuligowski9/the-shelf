name: Nightly Production Backup

on:
  schedule:
    # Runs at 5:00 AM UTC (midnight EST) every day
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: backend/api

      - name: Run backup from production
        run: node backup.js
        working-directory: backend/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Commit and push backup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated backup ${{ github.run_id }}"
          file_pattern: 'data/backups/*.json'
