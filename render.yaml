services:
  # Backend API
  - type: web
    name: shelf-api
    runtime: node
    rootDir: backend/api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually from Neon
    plan: free

  # Frontend Web
  - type: web
    name: shelf-web
    runtime: static
    rootDir: frontend/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set manually to your API URL after deployment
    plan: free
